services:
  quark-checkin:
    build: .
    container_name: quark-checkin
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai

      # ============================================================
      # 自定义签到时间（cron 表达式）
      # ============================================================
      # 格式：分 时 日 月 周
      # 0 9 * * *         每天 09:00（单次，当前默认）
      # 0 */6 * * *       每 6 小时一次（防漏签）
      # 0 8,12,16,20 * * * 每天 4 个时段（更保险）
      # 0 */2 * * *       每 2 小时一次（最保险）
      #
      # 说明：签到接口幂等，一天跑多次不会重复签到，只有当天第一次会真正签到。
      #      多次执行能有效防止「断网恰好错过签到点」导致的漏签。
      CRON_SCHEDULE: "0 9 * * *"

      # ============================================================
      # COOKIE_QUARK - 夸克账号配置（必填，请修改为你的实际信息）
      # ============================================================
      # 用户名随意填，只用于区分账号；url 填手机抓包得到的完整链接
      #
      # 【单用户】
      COOKIE_QUARK: "user=; url=;"
      #
      # 【多用户】用 && 拼成一行
      # COOKIE_QUARK: "user=账号A; url=https://drive-member.quark.cn/1/clouddrive/capacity/growth/info?kps=xxxA&sign=xxxA&vcode=xxxA;&&user=账号B; url=https://drive-member.quark.cn/1/clouddrive/capacity/growth/info?kps=xxxB&sign=xxxB&vcode=xxxB;"
      #
      # 【多用户】每行一个账号
      # COOKIE_QUARK: |
      #   user=账号A; url=https://drive-member.quark.cn/1/clouddrive/capacity/growth/info?kps=xxxA&sign=xxxA&vcode=xxxA;
      #   user=账号B; url=https://drive-member.quark.cn/1/clouddrive/capacity/growth/info?kps=xxxB&sign=xxxB&vcode=xxxB;
      #
      # ⚠️ 注意：
      # 1. url 必须包含 kps、sign、vcode 三个参数（手机抓包获取）
      # 2. 用户名可以是任意字符，多用户时用于区分
      # 3. 账号数量无限制
      # 4. 改完本文件需重新部署容器才生效（docker restart 不会重新读取环境变量）
      # 5. 抓包教程见 checkIn_Quark.py 文件头部注释